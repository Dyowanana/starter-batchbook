<style>
:root {
  --bg: #ffffff; --side: #f7f7f5; --fg: #37352f; --muted: #787774; --faint: #a5a29c; --line: #e9e9e7;
  --hover: rgba(55,53,47,.06); --card: #ffffff;
  --shadow: 0 0 0 1px rgba(15,15,15,.07), 0 2px 4px rgba(15,15,15,.06);
  --accent: #2383e2; --accent-soft: rgba(35,131,226,.12); --today: #eb5757; --warn-bg: #fdecc8; --warn-fg: #402c1b;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
  --c-carousel-bg: #d3e5ef; --c-carousel-fg: #183347; --c-carousel-dot: #337ea9;
  --c-lowEffort-bg: #dbeddb; --c-lowEffort-fg: #1c3829; --c-lowEffort-dot: #448361;
  --c-talking-bg: #f5e0e9; --c-talking-fg: #4c2337; --c-talking-dot: #c14c8a;
  --c-story-bg: #fadec9; --c-story-fg: #49290e; --c-story-dot: #d9730d;
  --c-task-bg: #e3e2e0; --c-task-fg: #32302c; --c-task-dot: #9b9a97;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --side: #202020; --fg: #e6e6e4; --muted: #9b9b9b; --faint: #6f6f6f; --line: #2f2f2f;
    --hover: rgba(255,255,255,.055); --card: #252525; --shadow: 0 0 0 1px rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.3);
    --accent: #529cca; --accent-soft: rgba(82,156,202,.18); --today: #ff7369; --warn-bg: #56452a; --warn-fg: #fcefd2;
    --c-carousel-bg: #28456c; --c-carousel-fg: #d6e8f7; --c-carousel-dot: #529cca;
    --c-lowEffort-bg: #2b4535; --c-lowEffort-fg: #dcf0e1; --c-lowEffort-dot: #4dab9a;
    --c-talking-bg: #4e2c3c; --c-talking-fg: #f7e1ec; --c-talking-dot: #e255a1;
    --c-story-bg: #5c3b23; --c-story-fg: #fbe2cf; --c-story-dot: #ffa344;
    --c-task-bg: #3a3a3a; --c-task-fg: #ebebea; --c-task-dot: #9b9b9b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
h1, h2, h3 { margin: 0; letter-spacing: -.01em; }

/* ---------- quiz (playful: colored page, stacked card, mascot) ---------- */
body.quizmode { background: var(--page, #FFF4E6); transition: background .4s ease; }
.quiz { --ink: #1E1B2E; --paper: #FFFDF8; --soft: #F5F1EA; --line2: #E8E1D6;
  max-width: 620px; margin: 0 auto; padding: 20px 16px 60px; min-height: 100vh; display: flex; flex-direction: column; color: var(--ink); font-family: "DM Sans", var(--font); }
.ws { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.ws-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.quiz .ws-mark { background: var(--ink); color: var(--paper); border-radius: 7px; }
.display { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 800; letter-spacing: -.015em; }
.stack { position: relative; margin-top: 18px; }
.stack::before, .stack::after { content: ""; position: absolute; inset: 0; border-radius: 28px; background: var(--paper); opacity: .55; transform: rotate(-2.2deg) translateY(6px); }
.stack::after { opacity: .35; transform: rotate(2deg) translateY(10px); }
.card { position: relative; z-index: 1; background: var(--paper); border-radius: 28px; padding: 26px 24px 24px; box-shadow: 0 18px 40px -18px rgba(30,27,46,.35); }
.dashes { display: flex; gap: 6px; margin-bottom: 18px; }
.dashes i { flex: 1; height: 5px; border-radius: 99px; background: var(--line2); transition: background .3s; }
.dashes i.on { background: var(--ink); }
.qlabel { font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; color: #8A8396; text-transform: uppercase; }
.mascot { width: 92px; height: 92px; margin: 2px 0 4px; animation: bob 3.2s ease-in-out infinite; }
.mascot .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.step { animation: in .35s cubic-bezier(.2,.8,.2,1) both; display: grid; gap: 16px; }
@keyframes in { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
.step h1 { font-size: clamp(38px, 9vw, 54px); line-height: 1.02; }
.step h2 { font-size: clamp(28px, 6.5vw, 36px); line-height: 1.08; }
.step h2 em { font-style: italic; color: var(--accent2, #7B5CE0); }
.lede { color: #5E5869; }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-size: 14px; font-weight: 700; }
.hint { font-size: 13px; color: #8A8396; }
.quiz .in { width: 100%; border: 2px solid var(--line2); background: var(--paper); border-radius: 16px; padding: 13px 15px; outline: 0; color: var(--ink); }
.quiz .in:focus { border-color: var(--ink); box-shadow: none; }
.fill { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--tint, var(--soft)); border-radius: 20px; padding: 14px 16px; }
.fill span { font-weight: 700; }
.fill .in { flex: 1 1 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 9px 16px; background: transparent; box-shadow: inset 0 0 0 2px var(--line2); color: #5E5869; font-weight: 600; transition: transform .12s; }
.chip:hover { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 0; border-radius: 22px; padding: 16px 14px; text-align: left; font-weight: 700; color: var(--ink); background: var(--t); display: grid; gap: 8px; transition: transform .15s, box-shadow .15s; box-shadow: inset 0 0 0 3px transparent; }
.tile .ico { font-size: 26px; line-height: 1; }
.tile:hover { transform: translateY(-2px) rotate(-.6deg); }
.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--ink); }
.tile[aria-pressed="true"]::after { content: "✓ picked"; font-size: 12px; font-weight: 700; }
.day { width: 42px; height: 42px; padding: 0; text-align: center; border-radius: 50%; }
.topic-row { display: flex; gap: 8px; }
.topic-row .in { flex: 1; }
.x { border: 0; background: transparent; color: #8A8396; border-radius: 12px; padding: 0 12px; font-size: 20px; }
.x:hover { background: var(--soft); color: var(--ink); }
.add { border: 2px dashed var(--line2); background: transparent; color: #5E5869; border-radius: 16px; padding: 12px; text-align: left; font-weight: 600; }
.add:hover { border-color: var(--ink); color: var(--ink); }
.timerow { display: grid; gap: 10px; padding: 16px; border-radius: 20px; background: var(--tint, var(--soft)); }
.timerow .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.hrs { width: 54px; height: 34px; text-align: center; padding: 0 4px; border: 2px solid var(--line2); border-radius: 10px; background: var(--paper); color: var(--ink); font-weight: 700; outline: 0; -moz-appearance: textfield; }
.hrs::-webkit-inner-spin-button, .hrs::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.hrs:focus { border-color: var(--ink); }
.timerow .day { width: 36px; height: 36px; font-size: 13px; }
.promise { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--c-bg); color: var(--c-fg); }
.promise .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.promise .txt { flex: 1; }
.promise .txt small { display: block; opacity: .75; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); font-size: 20px; line-height: 1; box-shadow: 0 2px 0 rgba(30,27,46,.15); }
.stepper button:active { transform: translateY(1px); box-shadow: none; }
.stepper b { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-size: 18px; }
.note { border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.note.ok { background: #E3F4E6; color: #1C3829; }
.note.warn { background: #FDECC8; color: #402c1b; }
.nav { display: flex; gap: 10px; margin-top: 6px; align-items: center; }
.btn { border: 0; border-radius: 8px; padding: 12px 18px; background: transparent; color: var(--muted); font-weight: 500; }
.btn:hover { background: var(--hover); color: var(--fg); }
.btn.primary { background: var(--accent); color: #fff; flex: 1; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { opacity: .45; cursor: default; filter: none; }
.quiz .btn { border-radius: 999px; padding: 14px 22px; font-weight: 700; color: #5E5869; }
.quiz .btn:hover { background: var(--soft); color: var(--ink); }
.quiz .btn.primary { background: var(--ink); color: var(--paper); font-size: 16px; transition: transform .12s; }
.quiz .btn.primary:hover { filter: none; transform: translateY(-1px); }
.quiz .btn.primary:active { transform: translateY(1px); }
.err { color: #D44C47; font-size: 14px; min-height: 18px; margin: 0; font-weight: 600; }
.perks { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.perks li { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.perks li::before { content: "✦"; color: var(--accent2, #7B5CE0); }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.top-row { display: flex; justify-content: space-between; align-items: center; }
.quiet .step, .quiet { animation: none !important; }
.tabhint { font-size: 12px; color: #8A8396; }
.tabhint kbd { font: 600 11px ui-monospace, monospace; border: 1.5px solid var(--line2); border-bottom-width: 3px; border-radius: 6px; padding: 1px 6px; background: var(--paper); color: var(--ink); }
@media (hover: none) { .tabhint { display: none; } }
.optin { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.optin input { width: 20px; height: 20px; margin-top: 1px; accent-color: #FDE047; flex: none; }
.saved-link { background: none; border: 0; color: var(--ink); text-decoration: underline; font-weight: 600; padding: 8px 0; justify-self: center; }
/* card extras: platform marks, swaps, slide editing, checklists */
.pi { display: inline-block; width: 20px; height: 20px; vertical-align: middle; }
.pi svg { width: 100%; height: 100%; display: block; }
.pi.plan { opacity: .35; filter: grayscale(.4); }
.pc-plats { display: inline-flex; gap: 6px; }
.swaps { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtn { border: 1.5px solid #E8E1D6; background: #fff; border-radius: 99px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; color: #3B3646; }
.sbtn:hover { border-color: #1E1B2E; }
.slide .grip { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: #A9A2B3; font-size: 14px; letter-spacing: -2px; cursor: grab; padding: 4px 10px; touch-action: none; }
.slide .sdel { position: absolute; top: 6px; left: 8px; border: 0; background: rgba(255,255,255,.7); width: 24px; height: 24px; border-radius: 50%; color: #6B6577; font-size: 15px; line-height: 1; }
.slide .sl-label { display: none; }
.slide.end { background: #E3F4E6; }
.slide.add { border: 2px dashed #CFC6DA; background: transparent; color: #6B6577; font-weight: 700; font-size: 15px; justify-content: center; align-items: center; cursor: pointer; flex-basis: 40%; }
.slide.add:hover { border-color: #1E1B2E; color: #1E1B2E; }
.sortable-ghost { opacity: .4; }
.tst { display: block; margin-bottom: 6px; }
.ti { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 3px 0; cursor: pointer; }
.ti input { width: 18px; height: 18px; margin-top: 1px; accent-color: #2F8A5B; flex: none; }
.ti input:checked + span { text-decoration: line-through; color: #8A8396; }
.tstep .tbody { margin: 0; }
.tstep.done .tbody { display: grid; }
.wchip { display: inline-flex; align-items: center; gap: 6px; }
.wchip .pi { width: 16px; height: 16px; }
/* post previews on the first-post card */
.pv { display: grid; gap: 8px; }
.pv-label { font: 600 11.5px/1 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: #8A8396; }
.pv-hint { margin: -4px 0 0; font-size: 12px; }
[contenteditable][data-ph]:empty::before { content: attr(data-ph); color: #A9A2B3; }
[contenteditable] { outline: 0; border-radius: 6px; }
[contenteditable]:focus { box-shadow: 0 0 0 2px rgba(123,92,224,.35); }
.slides { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; margin: 0 -4px; -webkit-overflow-scrolling: touch; }
.slide { flex: 0 0 74%; max-width: 300px; aspect-ratio: 4 / 5; border-radius: 16px; padding: 18px 16px; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; gap: 8px; background: #F7F4EE; position: relative; }
.slide.cover { background: #DCE5EF; }
.slide.last { background: #E3F4E6; }
.slide .sn { position: absolute; top: 10px; right: 12px; font: 600 11px ui-monospace, monospace; color: #8A8396; }
.slide .sl-label { position: absolute; top: 10px; left: 14px; font: 600 10.5px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: #8A8396; max-width: 70%; }
.slide .sl-text { font-size: 16px; font-weight: 600; line-height: 1.35; }
.slide.cover .sl-text { font-size: 21px; font-weight: 800; line-height: 1.2; }
.frame { width: min(250px, 78%); aspect-ratio: 9 / 16; margin: 0 auto; border-radius: 24px; background: linear-gradient(165deg, #4A4458, #1E1B2E 70%); color: #fff; position: relative; overflow: hidden; box-shadow: 0 0 0 5px #1E1B2E; }
.frame .ost { position: absolute; top: 11%; left: 8%; right: 8%; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.3; background: rgba(255,255,255,.96); color: #1E1B2E; padding: 8px 10px; border-radius: 8px; }
.frame .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.22); backdrop-filter: blur(4px); display: grid; place-items: center; font-size: 22px; padding-left: 4px; pointer-events: none; }
.frame .side { position: absolute; right: 10px; bottom: 22%; display: grid; gap: 14px; font-size: 18px; opacity: .85; pointer-events: none; }
.frame .cap { position: absolute; left: 10px; right: 48px; bottom: 14px; font-size: 12px; color: rgba(255,255,255,.85); }
.frame.split .half { position: absolute; left: 0; right: 0; height: 50%; }
.frame.split .half.top { top: 0; border-bottom: 2px solid rgba(255,255,255,.5); }
.frame.split .half.bot { bottom: 0; background: linear-gradient(165deg, #3E6B5A, #1E3A2E); }
.frame.split .ost { top: 14%; font-size: 13px; }
.frame.split .tag { position: absolute; left: 10px; bottom: 8px; font: 700 10px ui-monospace, monospace; letter-spacing: .08em; opacity: .8; }
.script { border: 1.5px solid #E8E1D6; border-radius: 16px; overflow: hidden; }
.sc-part { display: grid; grid-template-columns: 78px 1fr; }
.sc-part + .sc-part { border-top: 1.5px dashed #E8E1D6; }
.sc-tag { font: 700 11px/1.3 ui-monospace, monospace; letter-spacing: .08em; padding: 12px 10px; display: grid; align-content: start; gap: 2px; }
.sc-tag small { font-weight: 500; opacity: .7; letter-spacing: 0; }
.sc-part.hook .sc-tag { background: #FFE8F5; color: #9D2D6A; }
.sc-part.content .sc-tag { background: #E6F0FA; color: #1F4F7A; }
.sc-part.cta .sc-tag { background: #E3F4E6; color: #2F6B4A; }
.sc-body { padding: 12px; display: grid; gap: 10px; font-size: 15px; line-height: 1.45; min-width: 0; }
.sc-part.hook .sc-body { font-weight: 800; font-size: 17px; }
.sc-line { display: grid; gap: 2px; }
.sc-l { font-size: 11.5px; font-weight: 700; color: #8A8396; text-transform: uppercase; letter-spacing: .04em; }
@media (max-width: 520px) { .sc-part { grid-template-columns: 64px 1fr; } .slide { flex-basis: 80%; } }
.partpill { display: inline-block; background: var(--tint, #F5F1EA); color: var(--accent2, #1E1B2E); font-weight: 800; font-size: 14px; padding: 8px 14px; border-radius: 999px; }
.card.rays .partpill { background: rgba(255,255,255,.2); color: #FFFDF8; }
.wt { margin: 0; font-size: 14px; color: #3B3646; } .wt b { color: #1E1B2E; }
.wtab { grid-template-columns: auto 1fr !important; }
.tiles.two { grid-template-columns: 1fr 1fr !important; }
.sublabel { font-size: 12.5px; font-weight: 700; color: #5E5869; } .sublabel span { font-weight: 500; color: #8A8396; }
.subin { border: 2px dashed #CFC6DA !important; border-radius: 99px !important; background: rgba(255,255,255,.6) !important; padding: 7px 12px !important; }
.subin:focus { border-style: solid !important; border-color: #1E1B2E !important; background: #fff !important; }
.datein { cursor: pointer; }
.tim { height: 34px; border: 2px solid var(--line2); border-radius: 10px; background: var(--paper); color: var(--ink); font-weight: 700; padding: 0 6px; }
/* stop anything from pushing the card wider than the phone */
.card, .step, .step > *, .fill, .tiles, .timerow, .promise { min-width: 0; }
.fill .in, .topic-row .in { min-width: 0; }
/* part progress: 5 segments */
.parts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
.parts i { height: 5px; border-radius: 99px; background: var(--line2); }
.parts i.on { background: var(--ink); }
.parts i.now { background: linear-gradient(90deg, var(--ink) 50%, var(--line2) 50%); }
.card.rays .parts i { background: rgba(255,255,255,.3); } .card.rays .parts i.on, .card.rays .parts i.now { background: var(--paper); }
/* intro roadmap (stacked wallet tabs) */
.intro-top { display: flex; align-items: center; justify-content: space-between; }
.intro-top .mascot { width: 72px; height: 72px; }
.kick { font: 600 12px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--paper); padding: 7px 10px; border-radius: 99px; }
.wallet { position: relative; padding-top: 4px; }
.wtab { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; background: var(--t); border-radius: 18px 18px 0 0; padding: 14px 16px 26px; margin-bottom: -14px; box-shadow: 0 -1px 0 rgba(255,255,255,.6) inset, 0 -6px 14px -10px rgba(30,27,46,.25); }
.wtab .wn { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.7); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.wtab b { font-size: 15px; }
.wtab small { color: #5E5869; font-size: 12.5px; }
.wpocket { position: relative; z-index: 9; background: var(--paper); border: 2px dashed var(--line2); border-radius: 18px; padding: 16px; display: grid; gap: 4px; box-shadow: 0 -10px 20px -12px rgba(30,27,46,.25); }
.wpocket small { color: #5E5869; }
/* bigger "what for" tiles */
.tiles.big { grid-template-columns: 1fr; }
.tile small { display: block; font-weight: 500; color: #5E5869; font-size: 13px; }
.tiles.big .tile { grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; }
.tiles.big .tile .ico { grid-row: span 2; font-size: 30px; }
.tiles.big .tile[aria-pressed="true"]::after { display: none; }
/* topics + subtopic chips */
.topic-list { display: grid; gap: 10px; }
.topic-card { background: var(--tint, var(--soft)); border-radius: 20px; padding: 12px; display: grid; gap: 8px; }
.subs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

<!--
  YOUR HOOK BANK
  Paste more hooks anywhere inside this block, one per line. Bullets, numbers and quotes are fine.
  Lines starting with "This works because" and "Example (...)" (plus the example line after it) are skipped automatically.
  Blanks the quiz can fill: [TOPIC] [NICHE] [thing] (your niche) → their topic · [title] [identity] [profession] (avatar) → "I'm a ___"
  · [BELIEF] [opinion] [LESSON] [MESSAGE] [UNEXPECTED TRUTH] etc → their take. Anything else stays in brackets for them to fill.
-->
<script id="my-hooks" type="text/plain">
1. "Nobody talks about [TOPIC], but [UNEXPECTED INSIGHT]."
This works because it creates curiosity and makes the viewer feel like they’re about to learn something hidden or overlooked. It positions your content as a fresh perspective.

Example (Fitness):
"Nobody talks about why most diets fail, but your environment matters more than your motivation."


2. "Stop scrolling if you want to [DESIRED OUTCOME]."
This works because it immediately qualifies the right audience. People who want the outcome feel personally addressed and are more likely to keep watching.

Example (Business):
"Stop scrolling if you want to get your first 10 clients online."


3. "I wish someone had told me [LESSON] sooner."
This works because it uses personal experience and regret. Viewers pay attention because they want to learn something that could save them time, money, or effort.

Example (Content Creation):
"I wish someone had told me storytelling mattered more than editing sooner."


4. "This one mistake is costing you [RESULT]."
This works because it highlights a hidden problem and creates urgency. People want to identify what they might be doing wrong.

Example (Finance):
"This one mistake is costing you thousands in unnecessary spending."


5. "Here's what everyone gets wrong about [TOPIC]."
This works because it challenges common beliefs. Viewers are curious to see if they’re following outdated advice.

Example (Marketing):
"Here's what everyone gets wrong about growing on social media."


6. "You're making [GOAL] harder than it needs to be."
This works because it gives the viewer hope that there’s a simpler solution. People are attracted to removing unnecessary complexity.

Example (Productivity):
"You're making productivity harder than it needs to be."


7. "If I had to start from zero today, I'd [ACTION]."
This works because it creates authority and curiosity. It gives viewers a roadmap based on experience rather than theory.

Example (Entrepreneurship):
"If I had to start a business from zero today, I'd focus on one skill first."


8. "The biggest myth about [NICHE] is [BELIEF]."
This works because myths create tension. People want to know whether something they believe is actually wrong.

Example (Fitness):
"The biggest myth about fitness is that you need hours in the gym to transform your body."


9. "Before you [ACTION], watch this."
This works because it creates urgency and prevents the viewer from moving forward without your advice.

Example (Real Estate):
"Before you buy your first property, watch this."


10. "This changed everything for me when I [SITUATION]."
This works because transformation stories create emotional connection and curiosity about the turning point.

Example (Career):
"This changed everything for me when I started applying for jobs differently."


11. "You won't believe what happened when I [ACTION]."
This works because it creates an open loop. The viewer wants to discover the outcome.

Example (Fitness):
"You won't believe what happened when I walked 10,000 steps every day for 30 days."


12. "The reason you're not seeing [RESULT] is [HIDDEN PROBLEM]."
This works because it identifies a potential cause behind frustration. It makes viewers question whether they’re missing something.

Example (Content Creation):
"The reason you're not seeing growth is because your videos don't hold attention."


13. "Here's the part nobody tells you about [TOPIC]."
This works because it suggests there’s a hidden reality that beginners don’t know about.

Example (Entrepreneurship):
"Here's the part nobody tells you about building a personal brand."


14. "I almost didn't share this [LESSON/STORY], but [REASON]."
This works because it feels personal and exclusive. It creates the feeling that the viewer is getting access to something valuable.

Example (Mental Health):

"This simple shift in my sales conversations made all the difference."


16. "The answer might surprise you: [REVEAL]."

17. "What if I told you [UNEXPECTED TRUTH]?"

"What if I told you more customers isn't always the answer?"


18. "I've been doing [THING] all wrong."

"I've been doing portrait photography all wrong — here's what I changed."


19. "This is why your [THING] isn't [RESULT]."
This works because it directly addresses frustration and promises an explanation.

"This is why your content isn't converting viewers into followers."


20. "Let me show you what's actually working for [GOAL]."
This works because it promises practical, current information instead of theory.

Example (Marketing):
"Let me show you what's actually working for growing an email list."


21. "Three things you need to know before [ACTION]."
This works because numbered lists feel clear and valuable. Viewers know exactly what they’ll receive.

Example (Fitness):
"Three things you need to know before starting a calorie deficit."


22. "Save this for later because [REASON]."
This works because it encourages saves, which signals value and gives viewers a reason to return.

"Save this for later because you'll need this content strategy when you run out of ideas."


23. "Here's a step-by-step way to [RESULT]."

"Here's a step-by-step way to meal prep for the entire week."


24. "Do this instead of [COMMON ACTION]."

"Do this instead of doing endless cardio for fat loss."


25. "The easiest way to [RESULT] is [METHOD]."

27. "Here's the framework I use every time I [ACTION]."

"Here's the framework I use every time I write a sales page."


28. "The shortcut nobody is talking about is [METHOD]."
This works because people are naturally curious about overlooked advantages.

Example (Fitness):
"The shortcut nobody is talking about is building meals around protein first."


29. "The exact process I follow to [RESULT]."

"The exact process I follow to script videos that keep people watching."


30. "Steal this strategy for [GOAL]."

32. "Raise your hand if you've ever [RELATABLE EXPERIENCE]."

33. "I know exactly how this feels when [SITUATION]."

34. "You're not alone if [PROBLEM]."
This works because it removes isolation and creates connection.

"You're not alone if you feel stuck and unsure what direction to take."

"I used to think more followers meant more money."


36. "This was me [TIMEFRAME] ago."

"This was me 12 months ago before I changed my lifestyle."


37. "Can we all agree that [OBSERVATION]?"

"Can we all agree that coming up with content ideas is harder than creating the content?"


38. "Here's your reminder that [MESSAGE]."

"Here's your reminder that progress doesn't need to be perfect."

"If you're feeling stuck growing your brand, watch this."

const WIRE = {
  intro: () => { const b = $("openSaved"); if (b) b.onclick = () => { const s = store.get(); A = migrate(s.answers); BOOK = s.book; showBook(); }; },
  for: () => {
    $("forTiles").onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; A.forWhat = b.dataset.v;
      $("forTiles").querySelectorAll(".tile").forEach(x => x.setAttribute("aria-pressed", x === b));
      if (A.forWhat === "faceless") A.promise.talking = 0; };
  },
  about: () => {
    ["iam", "biz", "bizHelp", "page", "pageFor"].forEach(id => { const el = $(id); if (el) el.oninput = e => A[id] = e.target.value; });
    $("plat").onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; const v = b.dataset.v;
      A.platforms = A.platforms.includes(v) ? A.platforms.filter(x => x !== v) : [...A.platforms, v];
      b.setAttribute("aria-pressed", A.platforms.includes(v)); };
  },
  topics: () => {
    const list = $("topicList");
    const addTopic = () => { if (A.topics.length >= 5) return; A.topics.push(""); A.subs.push([]); render({ quiet: true, focus: `[data-i="${A.topics.length - 1}"]` }); };
    const addSub = inp => {
      const i = +inp.dataset.sub, v = inp.value.trim().replace(/,$/, "");
      inp.value = "";
      if (!v || (A.subs[i] || []).some(x => x.toLowerCase() === v.toLowerCase())) return;
      A.subs[i] = [...(A.subs[i] || []), v];
      render({ quiet: true, focus: `[data-sub="${i}"]` });
    };
    list.oninput = e => { if (e.target.dataset.i != null) A.topics[+e.target.dataset.i] = e.target.value; };
    list.onclick = e => {
      if (e.target.id === "addTopic") addTopic();
      if (e.target.dataset.del != null) { const i = +e.target.dataset.del; A.topics.splice(i, 1); A.subs.splice(i, 1); render({ quiet: true }); }
      if (e.target.dataset.subdel) { const [i, j] = e.target.dataset.subdel.split("|").map(Number); A.subs[i].splice(j, 1); render({ quiet: true, focus: `[data-sub="${i}"]` }); }
    };
    list.onkeydown = e => {
      if (e.target.dataset.sub != null && (e.key === "Enter" || e.key === ",")) { e.preventDefault(); addSub(e.target); }
      else if (e.target.dataset.sub != null && e.key === "Backspace" && !e.target.value) { const i = +e.target.dataset.sub; if ((A.subs[i] || []).length) { A.subs[i].pop(); render({ quiet: true, focus: `[data-sub="${i}"]` }); } }
      else if (e.target.dataset.i != null && e.key === "Enter") { e.preventDefault(); list.querySelector(`[data-sub="${e.target.dataset.i}"]`)?.focus(); }
    };
    // a subtopic typed but not "entered" still counts when they leave the box
    list.addEventListener("focusout", e => { if (e.target.dataset?.sub != null && e.target.isConnected && e.target.value.trim()) { const inp = e.target; setTimeout(() => addSub(inp), 0); } });
  },
  takes: () => {
    const t = A.topics.filter(Boolean)[takeTopic];
    document.querySelectorAll("[data-k]").forEach(inp => inp.oninput = e => { A.takes[t] = { ...(A.takes[t] || {}), [e.target.dataset.k]: e.target.value }; });
  },
  story: () => { ["oldMe", "newMe", "working"].forEach(id => $(id).oninput = e => A[id] = e.target.value); },
  time: () => {
    document.querySelectorAll("[data-h]").forEach(inp => inp.oninput = e => A.time[e.target.dataset.h].h = Math.max(0, +e.target.value || 0));
    document.querySelectorAll("[data-at]").forEach(inp => inp.oninput = e => A.time[e.target.dataset.at].at = e.target.value || "09:00");
    document.querySelectorAll(".timerow").forEach(row => row.onclick = e => {
      const d = e.target.dataset?.d; if (d == null) return;
      const k = row.dataset.t, days = A.time[k].days, n = +d;
      A.time[k].days = days.includes(n) ? days.filter(x => x !== n) : [...days, n].sort();
      e.target.setAttribute("aria-pressed", A.time[k].days.includes(n));
    });
  },
  promise: () => {
    const note = () => {
      const total = Object.values(A.promise).reduce((a, b) => a + b, 0);
      const need = { film: 0, edit: 0 };
      for (const k in A.promise) { need.film += A.promise[k] * TYPES[k].film; need.edit += A.promise[k] * TYPES[k].edit; }
      const have = { film: A.time.film.h * A.time.film.days.length * 60, edit: A.time.edit.h * A.time.edit.days.length * 60 };
      const over = ["film", "edit"].filter(k => need[k] > have[k]);
      $("promiseNote").innerHTML = total === 0 ? `<div class="note warn">Pick at least 1 post a week.</div>`
        : over.length ? `<div class="note warn">That's <b>${total} posts a week</b>. It needs about ${Math.ceil(need.film / 60 * 2) / 2} hrs of filming and ${Math.ceil(need.edit / 60 * 2) / 2} hrs of editing, more than the time you gave. Fewer posts you actually make beats more posts you skip.</div>`
        : `<div class="note ok">That's <b>${total} post${total > 1 ? "s" : ""} a week</b> ✨ and it fits your schedule.</div>`;
    };
    document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
      const k = b.dataset.p; A.promise[k] = Math.max(0, Math.min(14, A.promise[k] + +b.dataset.d));

  email: () => {
    $("name").oninput = e => A.name = e.target.value; $("email").oninput = e => A.email = e.target.value;
    $("updates").onchange = e => A.updates = e.target.checked;

function validate(s) {
  if (s === "for" && !A.forWhat) return "Pick one.";
  if (s === "about") {
    if (A.forWhat === "personal" && !A.iam.trim()) return "Fill in \"I'm ___\" so your hooks sound like you.";
    if (A.forWhat === "business" && !A.biz.trim()) return "Tell me what your business is.";
    if (A.forWhat === "faceless" && !A.page.trim()) return "Tell me what your page is about.";
  }
  if (s === "topics" && !A.topics.some(t => t.trim())) return "Add at least one pillar.";
  if (s === "takes") { const t = A.topics.filter(Boolean)[takeTopic]; const k = A.takes[t] || {};
    if (!["believe", "disagree", "untalked"].some(x => (k[x] || "").trim())) return "Fill in at least one."; }
  if (s === "time" && (!A.time.film.days.length || !A.time.edit.days.length)) return "Pick at least one day to film and one day to edit.";
  if (s === "promise" && !Object.values(A.promise).some(Boolean)) return "Pick at least 1 post a week.";
  if (s === "dates") {
    if (!A.start || !A.end) return "Pick both dates.";
    const days = (parse(A.end) - parse(A.start)) / 864e5 + 1;
    if (days < 1) return "The end date has to be after the start date.";
    if (days > 31) return "Keep it to 31 days max.";
  }
  if (s === "cta") {
    if (!A.ctas.length) return "Pick at least one.";
    if (A.ctas.includes("link") && !A.linkFor.trim()) return "Add what the link is for.";
  }
  if (s === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email.trim())) return "Pop in a valid email.";
  return "";
}

$("stepBox").addEventListener("click", async e => {
  const go = e.target.dataset?.go; if (!go) return;
  const s = STEPS[stepI];
  if (go === "back") {
    if (s === "takes" && takeTopic > 0) { takeTopic--; return render(); }
    do { stepI--; } while (stepI > 0 && skipStep(STEPS[stepI]));
    if (STEPS[stepI] === "takes") takeTopic = A.topics.filter(Boolean).length - 1;
    return render();
  }
  const err = validate(s);
  if (err) { $("err").textContent = err; return; }
  if (s === "topics") {
    const keep = A.topics.map((t, i) => [t.trim(), A.subs[i] || []]).filter(([t]) => t);
    A.topics = keep.map(k => k[0]); A.subs = keep.map(k => k[1]); takeTopic = 0;
  }
  if (s === "takes" && takeTopic < A.topics.length - 1) { takeTopic++; return render(); }
  if (s === "email") return finish();
  do { stepI++; } while (skipStep(STEPS[stepI]));
  render();
});

async function finish() {
  if (CONFIG.emailEndpoint) {
    try { await fetch(CONFIG.emailEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ name: A.name, email: A.email, wantsUpdates: A.updates, makingFor: A.forWhat, about: whoAmI() || A.page, topics: A.topics, platforms: A.platforms }) }); } catch (e) {}
  }
  BOOK = generate(A);
  save();
  deckI = 0;
  showDeck();
}

/* what the post will look like: slides for carousels, a 9:16 frame for low-effort videos, a script for talking/story videos */
const ed = (attr, val, ph, cls = "") => `<div class="${cls}" contenteditable="true" spellcheck="false" ${attr} data-ph="${esc(ph)}">${esc(val || "")}</div>`;
function postPreview(p) {
  const f = F[p.fmt], sl = f.slots;
  if (p.type === "carousel") {
    if (!p.slides) p.slides = sl.map((l, i) => ({ role: i === 0 ? "cover" : i === sl.length - 1 && /CTA|payoff|resolve/i.test(l) ? "end" : "point", t: p.slots[l] || (i === 0 ? p.hook : "") })).filter((x, i) => i === 0 || x.t);
    const n = p.slides.length;
    const slides = p.slides.map((x, i) => `<div class="slide ${x.role}">
        <span class="grip" title="Drag to move">⋮⋮</span><span class="sn">${i + 1}/${n}</span>
        ${n > 1 ? `<button class="sdel" data-sdel="${i}" aria-label="Delete slide">×</button>` : ""}
        ${ed(`data-sl="${i}"`, x.t, x.role === "cover" ? "Your hook" : x.role === "end" ? "Your CTA" : "One point, one short line", "sl-text")}</div>`).join("");
    return `<div class="pv"><div class="pv-label">Your carousel · swipe, drag ⋮⋮ to reorder</div><div class="slides">${slides}<button class="slide add" data-sadd>+ Add slide</button></div></div>`;
  }
  if (p.type === "lowEffort") {
    const split = p.fmt === "splitScreen" || p.fmt === "beforeAfter";
    const visual = p.fmt === "singleBroll" ? sl[0] : p.fmt === "problemStatement" ? sl[2] : null;
    const inner = split
      ? `<div class="half top">${ed(`data-slot="${esc(sl[0])}"`, p.slots[sl[0]], p.fmt === "beforeAfter" ? "Before" : "Old way", "ost")}<span class="tag">${p.fmt === "beforeAfter" ? "BEFORE" : "TOP"}</span></div>
         <div class="half bot">${ed(`data-slot="${esc(sl[1])}"`, p.slots[sl[1]], p.fmt === "beforeAfter" ? "After (on the beat drop)" : "New way", "ost")}<span class="tag">${p.fmt === "beforeAfter" ? "AFTER · beat drop" : "BOTTOM"}</span></div>`
      : `${ed(`data-f="hook"`, p.hook, "Text on screen", "ost")}`;
    return `<div class="pv"><div class="pv-label">Your video · 9:16</div>
      <div class="frame ${split ? "split" : ""}">${inner}
        <div class="play" aria-hidden="true">▶</div>
        <div class="side" aria-hidden="true"><span>♥</span><span>💬</span><span>↗</span></div>
        ${visual ? `<div class="cap">${ed(`data-slot="${esc(visual)}"`, p.slots[visual], "What's on screen (B-roll)", "")}</div>` : ""}
      </div></div>`;
  }
  // talking + story videos: a script split into hook / content / CTA
  const body = sl.filter(l => !/B-roll to film|^Caption$/i.test(l));
  const broll = sl.find(l => /B-roll to film/i.test(l));
  const isSilent = p.fmt === "silentFilm";
  return `<div class="pv"><div class="pv-label">${isSilent ? "Your on-screen text, line by line" : "Your script"}</div>

function postSlots() {

      silentFilm: () => `Last year: ${phrase(ang.old)}.`
    };

    let hook, point, slots2 = {};
    const s = fmt.slots;
    if (fixed[fmtKey] && repeat === 1) hook = fixed[fmtKey]();
    else hook = next(hookPool(ang), "hook-" + angleId);
    if (repeat === 2 && (slot.type === "talking" || slot.type === "story")) hook = next(H.part2, "p2");
    point = mainPoint(ang);
    s.forEach(label => slots2[label] = "");
    prefillSlots(slots2, fmtKey, ang, hook, point);
    const purpose = purposeFor(slot.type, ang.kind);
    const cta = ctaFor(purpose, ang.topic);
    const slides = slot.type === "carousel" ? makeSlides(hook, point, purpose, cta) : null;

    // film/edit on your chosen days before the post, never in the past; if there's no chosen day in time, do it on the post day
    const today0 = parse(iso(new Date()));
    const filmD = slot.type === "carousel" ? null : (taskDay(slot.date, A.time.film.days, today0) || parse(slot.date));
    const editD = taskDay(slot.date, A.time.edit.days, filmD || today0) || parse(slot.date);
    return {
      id: Math.random().toString(36).slice(2, 9),
      date: slot.date, type: slot.type, fmt: fmtKey, topic: ang.sub ? `${ang.topic} · ${ang.sub}` : ang.topic, hook, point,
      slots: slots2, slides, purpose, cta, ang,
      film: filmD ? iso(filmD) : "", edit: editD ? iso(editD) : "",

      where: Object.fromEntries((A.platforms.length ? A.platforms : PLATFORMS).map(pl => [pl, "plan"])),
      status: "Idea", notes: "", checks: []
    };
  });
  return { posts, created: Date.now() };
}

// time blocks: what to do on each film / edit / plan / ideas day
function timeBlocks(posts, from, start, end) {
  const out = {};
  const mins = (list, k) => list.reduce((s, p) => s + TYPES[p.type][k], 0);
  for (let d = new Date(from); d <= end; d = addDays(d, 1)) {
    const ds = iso(d), i = dowIdx(d), t = [];
    if (d >= start && A.time.ideas.days.includes(i)) t.push({ kind: "ideas", label: `💡 Find ideas · ${A.time.ideas.h}h`, posts: [] });
    if (d >= start && A.time.plan.days.includes(i)) t.push({ kind: "plan", label: `🗓️ Plan · ${A.time.plan.h}h`, posts: posts.filter(p => p.date > ds && p.date <= iso(addDays(d, 7))) });
    const f = posts.filter(p => p.film === ds), e = posts.filter(p => p.edit === ds);
    if (f.length) t.push({ kind: "film", label: `🎬 Film ${f.length} · ${A.time.film.h}h`, posts: f, need: mins(f, "film") });
    if (e.length) t.push({ kind: "edit", label: `✂️ Edit ${e.length} · ${A.time.edit.h}h`, posts: e, need: mins(e, "edit") });
    if (t.length) out[ds] = t;

}

/* ---------- add the schedule to a phone / Google / Apple calendar (.ics) ---------- */
function icsText(events) {
  const pad = n => String(n).padStart(2, "0");
  const stamp = (ds, m) => `${ds.replace(/-/g, "")}T${pad(Math.floor(m / 60) % 24)}${pad(m % 60)}00`;
  const escI = t => String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Starter Batchbook//EN", "CALSCALE:GREGORIAN",
    ...events.flatMap(e => ["BEGIN:VEVENT", `UID:${Math.random().toString(36).slice(2)}@batchbook`, `DTSTAMP:${now}`,
      `DTSTART:${stamp(e.ds, e.start)}`, `DTEND:${stamp(e.ds, Math.min(e.end, 24 * 60 - 1))}`, `SUMMARY:${escI(e.title)}`, `DESCRIPTION:${escI(e.desc)}`,
      "BEGIN:VALARM", "TRIGGER:-PT15M", "ACTION:DISPLAY", `DESCRIPTION:${escI(e.title)}`, "END:VALARM", "END:VEVENT"]),
    "END:VCALENDAR"].join("\r\n");
}
function downloadIcs(events, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsText(events)], { type: "text/calendar;charset=utf-8" }));
  a.download = name; a.click();
  setTimeout(() => alert(`Downloaded ${name} ✅\n\niPhone / Mac: open the file and tap Add All.\nGoogle Calendar: calendar.google.com → Settings → Import & export → Import → pick the file.`), 300);
}
function exportIcs() {
  const ev = [];
  Object.entries(window.__blocks || {}).forEach(([ds, list]) => list.forEach(b => { const s = toMin(A.time[b.kind].at);
    ev.push({ ds, start: s, end: s + A.time[b.kind].h * 60, title: `${blockTitle(b)} (content)`, desc: [...b.posts.map(p => "• " + p.hook), "", ...BLOCK_TIPS[b.kind].map(t => "- " + t)].join("\n") }); }));
  BOOK.posts.forEach(p => { const s = toMin(p.at || A.postAt);
    ev.push({ ds: p.date, start: s, end: s + 30, title: `Post: ${p.hook}`, desc: `${TYPES[p.type].label} · ${F[p.fmt].name}\nPost to: ${Object.keys(p.where).join(", ")}${p.purpose === "virality" ? "" : `\nCTA: ${p.cta}`}` }); });
  downloadIcs(ev, "my-content-schedule.ics");
}
